name: portfolioo
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: .
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /api/health
      port: 8000
    envs:
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: PYTHONUNBUFFERED
        value: "1"
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
    github:
      repo: HATIMMAACHI/portfolioo
      branch: main
      deploy_on_push: true
